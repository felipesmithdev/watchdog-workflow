name: Build e Release do Watchdog

# Roda automaticamente ao empurrar uma tag de versão (ex: v1.0.0),
# ou manualmente pela aba Actions do GitHub (sem criar release,
# só pra gerar o .exe como artifact e testar o build).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    # IMPORTANTE: precisa rodar em windows-latest. PyInstaller não faz
    # cross-compile - gerar o .exe num runner Linux produziria um
    # binário Linux, inútil pros KVMs. O runner tem que ser Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build do .exe
        run: pyinstaller --onefile --console --name watchdog main.py

      - name: Upload do artifact (toda execução, inclusive manual)
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-exe
          path: dist/watchdog.exe

      - name: Criar Release no GitHub (apenas quando a tag é empurrada)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/watchdog.exe
          generate_release_notes: true
