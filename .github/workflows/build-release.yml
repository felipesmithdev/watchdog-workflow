name: Build e Release do Watchdog

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verificar PyInstaller
        run: python -m PyInstaller --version

      - name: Build EXE
        run: python -m PyInstaller --clean --onefile --noconsole watchdog.py

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-exe
          path: dist/watchdog.exe

      - name: Criar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/watchdog.exe
          generate_release_notes: true
